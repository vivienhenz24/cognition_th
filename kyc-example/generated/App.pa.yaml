App:
  Properties:
    Formulas: |-
      =Theme = {
        Primary: RGBA(0, 120, 212, 1),
        Accent: RGBA(0, 153, 188, 1),
        Success: RGBA(16, 124, 16, 1),
        Warning: RGBA(202, 80, 16, 1),
        Danger: RGBA(196, 43, 28, 1),
        Text: RGBA(32, 31, 30, 1),
        TextMuted: RGBA(96, 94, 92, 1),
        Border: RGBA(225, 223, 221, 1),
        Surface: RGBA(255, 255, 255, 1),
        Background: RGBA(243, 242, 241, 1),
        White: RGBA(255, 255, 255, 1)
      };
      Space = {XS: 4, S: 8, M: 16, L: 24};
      RiskBands = Table(
        {Name: "Low", Min: 1, Max: 3, Color: Theme.Success},
        {Name: "Medium", Min: 4, Max: 7, Color: Theme.Warning},
        {Name: "High", Min: 8, Max: 10, Color: Theme.Danger}
      );
      PendingRequests = Filter(KYC_Requests, status = "Pending");
      ReviewedRequests = Filter(KYC_Requests, status <> "Pending");
      ApprovedToday = Filter(KYC_Requests, status = "Approved" And IsToday(reviewed_date));
      RejectedToday = Filter(KYC_Requests, status = "Rejected" And IsToday(reviewed_date))
    OnStart: |-
      =ClearCollect(KYC_Requests,
        {id: 1, customer_name: "Alice Johnson", customer_email: "alice.johnson@example.com", risk_score: 2, submission_date: DateAdd(Today(), -7, TimeUnit.Days), status: "Pending", reviewer_notes: "", reviewed_by: "", reviewed_date: DateTimeValue("")},
        {id: 2, customer_name: "Bob Smith", customer_email: "bob.smith@example.com", risk_score: 5, submission_date: DateAdd(Today(), -6, TimeUnit.Days), status: "Pending", reviewer_notes: "", reviewed_by: "", reviewed_date: DateTimeValue("")},
        {id: 3, customer_name: "Carol Williams", customer_email: "carol.williams@example.com", risk_score: 8, submission_date: DateAdd(Today(), -5, TimeUnit.Days), status: "Pending", reviewer_notes: "", reviewed_by: "", reviewed_date: DateTimeValue("")},
        {id: 4, customer_name: "David Brown", customer_email: "david.brown@example.com", risk_score: 3, submission_date: DateAdd(Today(), -4, TimeUnit.Days), status: "Pending", reviewer_notes: "", reviewed_by: "", reviewed_date: DateTimeValue("")},
        {id: 5, customer_name: "Eva Martinez", customer_email: "eva.martinez@example.com", risk_score: 9, submission_date: DateAdd(Today(), -3, TimeUnit.Days), status: "Pending", reviewer_notes: "", reviewed_by: "", reviewed_date: DateTimeValue("")},
        {id: 6, customer_name: "Frank Davis", customer_email: "frank.davis@example.com", risk_score: 6, submission_date: DateAdd(Today(), -2, TimeUnit.Days), status: "Pending", reviewer_notes: "", reviewed_by: "", reviewed_date: DateTimeValue("")},
        {id: 7, customer_name: "Grace Wilson", customer_email: "grace.wilson@example.com", risk_score: 1, submission_date: DateAdd(Today(), -1, TimeUnit.Days), status: "Pending", reviewer_notes: "", reviewed_by: "", reviewed_date: DateTimeValue("")},
        {id: 8, customer_name: "Henry Taylor", customer_email: "henry.taylor@example.com", risk_score: 10, submission_date: Today(), status: "Pending", reviewer_notes: "", reviewed_by: "", reviewed_date: DateTimeValue("")}
      );
      ClearCollect(Audit_Log, {action_type: "", user: "", timestamp: Now(), record_id: 0, details: ""});
      Clear(Audit_Log);
      Set(varSelected, Blank());
      Set(varConfirmMode, "")
    StartScreen: =Screen1
    Theme: =PowerAppsTheme
