<button
  data-slot="button"
  class="ui-button ui-button--{{ variant|default:'default' }} ui-button--{{ size|default:'default' }}"
  type="{{ button_type|default:'button' }}"
  {% if name %}name="{{ name }}"{% endif %}
  {% if value %}value="{{ value }}"{% endif %}
  {% if disabled %}disabled{% endif %}
>{{ label }}</button>
